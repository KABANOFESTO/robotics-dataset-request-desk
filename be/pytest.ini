[pytest]
DJANGO_SETTINGS_MODULE = test_settings
python_files = test_*.py
testpaths = accounts/tests episodes/tests requests/tests
addopts = -ra --strict-markers --cov=accounts --cov=episodes --cov=requests --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml --cov-report=html:htmlcov
